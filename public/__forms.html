<!DOCTYPE html>
<!--
  Not a real page — never linked, never rendered to a visitor. Exists solely
  so Netlify's build-time form detection (which can no longer scan the live
  App Router page's rendered HTML under the v5 Next.js Runtime) has a static
  file to parse. Field names/order here must stay in sync with the live form
  in ContactForm.tsx. See https://opennext.js.org/netlify/forms.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Form definitions</title>
  </head>
  <body>
    <form name="briefing-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="briefing-request" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="organization" type="text" />
      <input name="phone" type="tel" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
